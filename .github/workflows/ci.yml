name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed services
    runs-on: ubuntu-24.04
    outputs:
      services: ${{ steps.pick.outputs.services }}
      gateway-ui: ${{ steps.filter.outputs.gateway-ui }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            gateway: ['gateway/**']
            gateway-ui: ['gateway/src/main/webapp/**', 'gateway/package*.json']
            catalog: ['catalog/**']
            inventory: ['inventory/**']
            order: ['order/**']
            payment: ['payment/**']
      - id: pick
        name: Services to build
        env:
          CHANGED: ${{ steps.filter.outputs.changes }}
          EVENT: ${{ github.event_name }}
        run: |
          # Every service on main; only the changed ones on pull requests
          if [ "$EVENT" = "push" ]; then
            services='["gateway","catalog","inventory","order","payment"]'
          else
            services=$(echo "$CHANGED" | jq -c '[.[] | select(. != "gateway-ui")]')
          fi
          echo "services=$services" >> "$GITHUB_OUTPUT"
          echo "Building: $services"

  service:
    name: ${{ matrix.service }}
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    env:
      # Containers must not outlive the job on shared runners
      TESTCONTAINERS_REUSE_ENABLE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml
      - uses: actions/setup-node@v4
        if: matrix.service == 'gateway'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: gateway/package-lock.json
      - name: Unit and integration tests (Testcontainers)
        run: ./mvnw -ntp -B verify -DskipJib
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-test-reports
          path: |
            ${{ matrix.service }}/target/surefire-reports
            ${{ matrix.service }}/target/failsafe-reports
          retention-days: 7

  gateway-ui:
    name: gateway UI (lint, unit tests)
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.gateway-ui == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: gateway/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  compose:
    name: docker-compose config
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Post-generation fixes are applied and idempotent
        run: |
          python3 scripts/harden-compose.py
          git diff --exit-code -- docker-compose/
      - name: Compose file is valid with the example secrets
        run: |
          cp docker-compose/.env.example docker-compose/.env
          docker compose -f docker-compose/docker-compose.yml config -q
          docker compose -f docker-compose/docker-compose.yml -f scripts/e2e/compose.override.yml config -q
