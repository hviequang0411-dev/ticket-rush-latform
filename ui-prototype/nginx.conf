server {
    listen 80;
    root /usr/share/nginx/html;

    # Fingerprinted by Vite: cache for good
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client-side routes all load the SPA shell, which must never be cached across deploys
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
