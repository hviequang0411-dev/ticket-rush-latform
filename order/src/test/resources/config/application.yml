# ===================================================================
# Spring Boot configuration.
#
# This configuration is used for unit/integration tests.
#
# More information on profiles: https://www.jhipster.tech/profiles/
# More information on configuration properties: https://www.jhipster.tech/common-application-properties/
# ===================================================================

# ===================================================================
# Standard Spring Boot properties.
# Full reference is available at:
# https://docs.spring.io/spring-boot/appendix/application-properties/index.html
# ===================================================================

spring:
  application:
    name: order
  cloud:
    consul:
      discovery:
        enabled: false
        instanceId: ${spring.application.name}:${spring.application.instance-id:${random.value}}
      config:
        enabled: false
      enabled: false
    # Same topic contract as src/main/resources/config/application.yml (this file replaces it in tests)
    function:
      definition: holdExpired;paymentResults
    stream:
      bindings:
        holdExpired-in-0:
          destination: inventory.hold-expired.v1
          content-type: application/json
          group: order
        paymentResults-in-0:
          destination: payment.result.v1
          content-type: application/json
          group: order
  # Replace by 'prod, faker' to add the faker context and have sample data loaded in production
  liquibase:
    contexts: test
  jackson:
    datatype:
      datetime:
        write-durations-as-timestamps: false
  mail:
    host: localhost
  main:
    allow-bean-definition-overriding: true
  messages:
    basename: i18n/messages
  security:
    oauth2:
      client:
        provider:
          oidc:
            issuer-uri: http://DO_NOT_CALL:9080/realms/jhipster
      resourceserver:
        jwt:
          principal-claim-name: preferred_username
  task:
    execution:
      thread-name-prefix: order-task-
      pool:
        core-size: 1
        max-size: 50
        queue-capacity: 10000
    scheduling:
      thread-name-prefix: order-scheduling-
      pool:
        size: 20
  thymeleaf:
    mode: HTML

server:
  port: 10344
  address: localhost

# ===================================================================
# JHipster specific properties
#
# Full reference is available at: https://www.jhipster.tech/common-application-properties/
# ===================================================================
jhipster:
  mail:
    from: order@localhost.com
    base-url: http://127.0.0.1:8080
  logging:
    # To test json console appender
    use-json-format: false
    logstash:
      enabled: false
      host: localhost
      port: 5000
      ring-buffer-size: 512

# ===================================================================
# Application specific properties
# Add your own application properties here, see the ApplicationProperties class
# to have type-safe configuration, like in the JHipsterProperties above
#
# More documentation is available at:
# https://www.jhipster.tech/common-application-properties/
# ===================================================================

# application:
management:
  health:
    mail:
      enabled: false

ticketrush:
  outbox:
    # Tests relay explicitly through OutboxRelay.relayBatch() instead of the scheduler
    relay-enabled: false

# Calls to catalog, inventory and payment (ServiceClientsConfiguration). All of them are idempotent, so retrying
# a timeout or a 5xx is safe; 4xx answers (sold out, already paid) are business results, never retried or
# counted as failures.
resilience4j:
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        # Any failed call except a 4xx answer: timeouts and I/O errors while reading a response surface as plain
        # RestClientException, not only as ResourceAccessException (see ResilientClientTest)
        retry-exceptions:
          - org.springframework.web.client.RestClientException
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
    instances:
      catalog:
        base-config: default
      inventory:
        base-config: default
      payment:
        base-config: default
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - org.springframework.web.client.RestClientException
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
    instances:
      catalog:
        base-config: default
      inventory:
        base-config: default
      payment:
        base-config: default
  bulkhead:
    configs:
      default:
        # One slow dependency can hold at most this many request threads
        max-concurrent-calls: 25
        max-wait-duration: 100ms
    instances:
      catalog:
        base-config: default
      inventory:
        base-config: default
      payment:
        base-config: default
