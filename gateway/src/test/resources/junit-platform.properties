# First test in a cold JVM pays class loading (25-40 s seen on dev laptops); 15 s made CI flaky
junit.jupiter.execution.timeout.default = 60 s
junit.jupiter.execution.timeout.testable.method.default = 60 s
junit.jupiter.execution.timeout.beforeall.method.default = 60 s
junit.jupiter.testclass.order.default=com.ticketrush.gateway.config.SpringBootTestClassOrderer
