global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Every TicketRush service instance registered in Consul, healthy ones only: scaling out needs no config change
  - job_name: ticketrush
    metrics_path: /management/prometheus
    consul_sd_configs:
      - server: consul:8500
        services: [gateway, catalog, inventory, order, payment]
    relabel_configs:
      # Healthy instances only: a restarted service leaves a critical registration behind for a while
      - source_labels: [__meta_consul_health]
        regex: passing
        action: keep
      - source_labels: [__meta_consul_service]
        target_label: service
      - source_labels: [__meta_consul_service_id]
        target_label: instance

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
