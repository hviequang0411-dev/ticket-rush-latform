#common configuration shared between all applications
configserver:
  name: Service Registry
  status: Connected to Consul running in Docker

# jhipster.security.authentication.jwt.base64-secret is injected per service via the
# JHIPSTER_SECURITY_AUTHENTICATION_JWT_BASE64_SECRET env var (see ../.env.example).

spring:
  cloud:
    consul:
      discovery:
        # Only return instances whose health check passes: after a restart the old registration lingers as
        # 'critical' and the load balancer would otherwise keep picking it
        query-passing: true
        # Remove registrations of instances that died without deregistering
        health-check-critical-timeout: 1m

management:
  metrics:
    distribution:
      # Histograms so Grafana can compute p95/p99 across instances (histogram_quantile)
      percentiles-histogram:
        http.server.requests: true
        ticketrush.checkout: true
