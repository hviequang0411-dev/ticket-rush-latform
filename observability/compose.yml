# Metrics, traces and dashboards, layered on top of the generated stack:
#   docker compose -f docker-compose/docker-compose.yml -f observability/compose.yml up -d --wait
#
# Relative paths resolve against docker-compose/ (the first file's directory), hence the ../observability prefix.
services:
  prometheus:
    image: prom/prometheus:v3.14.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      # Exemplars link a latency sample to the trace that produced it
      - --enable-feature=exemplar-storage
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - 127.0.0.1:9090:9090

  # Jaeger 2.22 dropped the HTTP API Grafana's Jaeger datasource uses; Tempo is Grafana's own trace store
  # Tempo runs as uid 10001 and its image has no shell tools: hand it the volume first
  tempo-init:
    image: busybox:1.37.0
    command: ['chown', '10001:10001', '/var/tempo']
    volumes:
      - tempo-data:/var/tempo

  tempo:
    image: grafana/tempo:2.10.10
    command: ['-config.file=/etc/tempo.yaml']
    volumes:
      - ../observability/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    depends_on:
      tempo-init:
        condition: service_completed_successfully

  grafana:
    image: grafana/grafana:13.2.2
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:?}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/ticketrush.json
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - 127.0.0.1:3000:3000
    depends_on:
      - prometheus
      - tempo

  # Services export traces over OTLP to Tempo
  gateway:
    environment:
      - MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT=http://tempo:4318/v1/traces
      # Every request traced in the demo; lower it for load tests (TRACING_SAMPLING_PROBABILITY)
      - MANAGEMENT_TRACING_SAMPLING_PROBABILITY=${TRACING_SAMPLING_PROBABILITY:-1.0}
  catalog:
    environment:
      - MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT=http://tempo:4318/v1/traces
      # Every request traced in the demo; lower it for load tests (TRACING_SAMPLING_PROBABILITY)
      - MANAGEMENT_TRACING_SAMPLING_PROBABILITY=${TRACING_SAMPLING_PROBABILITY:-1.0}
  inventory:
    environment:
      - MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT=http://tempo:4318/v1/traces
      # Every request traced in the demo; lower it for load tests (TRACING_SAMPLING_PROBABILITY)
      - MANAGEMENT_TRACING_SAMPLING_PROBABILITY=${TRACING_SAMPLING_PROBABILITY:-1.0}
  order:
    environment:
      - MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT=http://tempo:4318/v1/traces
      # Every request traced in the demo; lower it for load tests (TRACING_SAMPLING_PROBABILITY)
      - MANAGEMENT_TRACING_SAMPLING_PROBABILITY=${TRACING_SAMPLING_PROBABILITY:-1.0}
  payment:
    environment:
      - MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT=http://tempo:4318/v1/traces
      # Every request traced in the demo; lower it for load tests (TRACING_SAMPLING_PROBABILITY)
      - MANAGEMENT_TRACING_SAMPLING_PROBABILITY=${TRACING_SAMPLING_PROBABILITY:-1.0}

volumes:
  tempo-data:
