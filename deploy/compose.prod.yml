# Public demo on one VM, layered over the generated stack and observability:
#   docker compose -f docker-compose/docker-compose.yml -f observability/compose.yml -f deploy/compose.prod.yml up -d
# deploy/deploy.sh does this on the VM. Relative paths resolve against docker-compose/.
#
# Caddy terminates HTTPS (Let's Encrypt) for three hosts:
#   ${DOMAIN}          gateway (UI + APIs)
#   auth.${DOMAIN}     Keycloak, so browsers can log in and tokens carry a public issuer
#   grafana.${DOMAIN}  Grafana (its own login)
# Nothing else is published: Consul, Kafka, databases, Prometheus and Jaeger stay on the internal network.
services:
  caddy:
    image: caddy:2.10.2
    restart: unless-stopped
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    environment:
      - DOMAIN=${DOMAIN:?}
      - ACME_EMAIL=${ACME_EMAIL:?}
    volumes:
      - ../deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - gateway
      - keycloak
      - grafana

  gateway:
    restart: unless-stopped
    # Only reachable through Caddy
    ports: !reset []
    environment:
      - SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_OIDC_ISSUER_URI=https://auth.${DOMAIN:?}/realms/jhipster
      - SERVER_FORWARD_HEADERS_STRATEGY=framework
  catalog:
    restart: unless-stopped
    environment:
      - SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_OIDC_ISSUER_URI=https://auth.${DOMAIN:?}/realms/jhipster
  inventory:
    restart: unless-stopped
    environment:
      - SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_OIDC_ISSUER_URI=https://auth.${DOMAIN:?}/realms/jhipster
  order:
    restart: unless-stopped
    environment:
      - SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_OIDC_ISSUER_URI=https://auth.${DOMAIN:?}/realms/jhipster
  payment:
    restart: unless-stopped
    environment:
      - SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_OIDC_ISSUER_URI=https://auth.${DOMAIN:?}/realms/jhipster
      # The mock provider's hosted page; this demo has no real payment provider account
      - TICKETRUSH_PAYMENT_PUBLIC_BASE_URL=https://${DOMAIN:?}

  keycloak:
    restart: unless-stopped
    ports: !reset []
    environment:
      # Public URL in tokens and redirects; Caddy forwards to plain HTTP inside
      - KC_HOSTNAME=https://auth.${DOMAIN:?}
      - KC_PROXY_HEADERS=xforwarded
      - KC_HTTP_ENABLED=true
    volumes:
      # Same realm plus the public redirect URIs (generated by deploy/deploy.sh)
      - ../deploy/build/realm-config:/opt/keycloak/data/import

  grafana:
    restart: unless-stopped
    ports: !reset []
    environment:
      - GF_SERVER_ROOT_URL=https://grafana.${DOMAIN:?}

  prometheus:
    restart: unless-stopped
    ports: !reset []
  jaeger:
    restart: unless-stopped
    ports: !reset []
  consul:
    ports: !reset []

volumes:
  caddy-data:
